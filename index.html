<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d1b;--panel:#191225;--fg:#f3ecf8;--mut:#a899bb;--acc:#e8c58e;--acc2:#f0a6b8;--onacc:#2a1a05;--card:#221832;--bd:#33264a;--ub:#2c2142;--glow:rgba(232,197,142,.2);--g1:rgba(155,92,230,.26);--g2:rgba(240,166,184,.12);--shadow:0 14px 44px -14px rgba(0,0,0,.6);box-sizing:border-box}
:root[data-theme=light]{--bg:#f6f2fa;--panel:#ece5f4;--fg:#231a30;--mut:#7c6f8e;--acc:#5b2d8e;--acc2:#c85a8a;--onacc:#fff;--card:#fff;--bd:#ddd2ea;--ub:#e9defa;--glow:rgba(91,45,142,.16);--g1:rgba(155,92,230,.16);--g2:rgba(240,166,184,.2);--shadow:0 14px 44px -16px rgba(70,35,110,.3)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}
body{height:100dvh;color:var(--fg);font:16px/1.6 Nunito,"Noto Sans Devanagari","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(900px 520px at 85% -10%,var(--g1),transparent 62%),radial-gradient(700px 500px at -10% 110%,var(--g2),transparent 60%),var(--bg)}
[hidden]{display:none!important}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover,select:hover{border-color:var(--acc)}input{cursor:text;width:100%}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#side{width:272px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-inline-end:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:9px;flex-shrink:0;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 2px 8px}.brand b{font:600 22px/1 Fraunces,Georgia,serif;letter-spacing:.2px}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:17px;box-shadow:0 6px 18px var(--glow)}
#new{border-color:var(--acc);font-weight:700}#q{border-radius:12px}
#list{flex:1;overflow:auto}.it{display:flex;align-items:center;gap:2px;border-radius:12px;margin:2px 0}.it:hover{background:var(--card)}.it.on{background:var(--card);box-shadow:inset 3px 0 0 var(--acc)}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:7px 8px;cursor:pointer;font-size:15px}.it button{border:0;background:none;padding:4px 6px;color:var(--mut)}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0;padding:8px 6px;font-size:14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:none;padding:8px 12px;gap:10px;align-items:center;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow:auto;padding:20px 16px}.w{max-width:760px;margin:0 auto}
.m{margin:18px 0;display:flex;flex-direction:column}.m.u{align-items:flex-end}
.b{max-width:100%;overflow-wrap:anywhere}
.u .b{max-width:88%;padding:10px 16px;border-radius:22px 22px 6px 22px;background:var(--ub);border:1px solid color-mix(in srgb,var(--acc) 22%,transparent);white-space:pre-wrap}
.m.a{position:relative;padding-inline-start:46px}.m.a::before{content:'✦';position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:15px;box-shadow:0 4px 14px var(--glow)}
.m.a .b{line-height:1.72}
.b pre{position:relative;background:var(--panel);border:1px solid var(--bd);padding:12px;border-radius:14px;overflow-x:auto}.b code{background:var(--panel);padding:1px 5px;border-radius:6px;font-size:.92em}.b pre code{padding:0;background:none}
.b p{margin:.5em 0}.err{color:#ff7b8a}.act{display:flex;gap:2px;margin-top:2px}.act button{font-size:15px;padding:4px 9px;border:0;background:none;color:var(--mut);border-radius:9px}.act button:hover{background:var(--panel);color:var(--fg)}
.b table{border-collapse:collapse;display:block;overflow-x:auto}.b td,.b th{border:1px solid var(--bd);padding:5px 10px;text-align:start}.b th{background:var(--panel)}.b a{color:var(--acc)}.b ul,.b ol{margin:.4em 0;padding-inline-start:1.4em}.cp{float:right;font-size:12px;padding:2px 8px}.thumb{display:block;max-width:220px;max-height:220px;border-radius:14px;margin-bottom:6px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--acc);animation:bn 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
#docbar{cursor:pointer;width:calc(100% - 24px);font-size:13px;padding:6px 14px;margin-bottom:2px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;color:var(--mut)}
#box{display:flex;gap:2px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:7px 7px 7px 10px;margin:6px auto 4px;width:calc(100% - 24px);max-width:760px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
#box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow),var(--shadow)}
#box button{border:0;background:none;font-size:19px;padding:0;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}#box button:hover{background:var(--panel)}
#box #send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:20px;font-weight:700;box-shadow:0 6px 16px var(--glow)}
textarea{flex:1;border:0;background:none;color:var(--fg);font:inherit;resize:none;max-height:180px;padding:9px 6px;outline:none}textarea::placeholder{color:var(--mut)}
.note{font-size:12px;color:var(--mut);text-align:center;margin:0 12px 8px}
#hi{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:9vh auto 0;text-align:center}
#hi::before{content:'✦';grid-column:1/-1;justify-self:center;display:grid;place-items:center;width:76px;height:76px;border-radius:28px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:36px;box-shadow:0 16px 44px var(--glow);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){#hi::before,.dots i{animation:none}}
#hi h1{grid-column:1/-1;margin:10px 0 8px;font:600 31px/1.2 Fraunces,Georgia,serif}
#hi button{padding:14px 12px;border-radius:18px;background:var(--card);line-height:1.35}#hi button:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px var(--glow)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:22px;width:min(94vw,460px);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(10,5,20,.55);backdrop-filter:blur(6px)}dialog label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--panel)}[dir=rtl] #side{inset:0 0 0 auto;transform:translateX(100%)}#side.open{transform:none}#top{display:flex}#hi{margin-top:5vh}}
.k{color:var(--acc);font-weight:600}.s{color:#4ca06d}.c{color:var(--mut)}.n{color:#d08a3c}pre i{font-style:normal}pre i.c{font-style:italic}
.orb{display:block;width:120px;height:120px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));margin:18px auto;cursor:pointer}.orb.l{animation:pl 1.2s infinite}.orb.t{animation:pl .6s infinite;opacity:.55}@keyframes pl{50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.orb{animation:none!important}}
.pv{float:right;font-size:12px;padding:2px 8px;margin-right:4px}#pvf{width:100%;height:60vh;border:1px solid var(--bd);border-radius:12px;background:#fff}.sg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.sg button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:6px 12px;font-size:14px}math{font-size:1.1em}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script></head><body>
<aside id="side"><div class="brand"><span class="logo">✦</span><b>Nova AI</b></div>
<button id="new" data-i="new">＋ New chat</button><input id="q" type="search" data-p="search" aria-label="Search chats"><div id="list"></div>
<select id="lang" aria-label="Reply language"></select>
<select id="bot" aria-label="Assistant"></select><button id="botn">＋ New assistant</button><button id="xmd">📝 Export this chat</button>
<select id="spd" aria-label="Speed" hidden><option value="quick">⚡ Fast</option><option value="default">Smart</option><option value="complex">Deep think</option></select>
<div class="row"><button id="mem" data-i="mem">🧠 Memory</button><button id="cfg" data-i="cfg">⚙ Setup</button><button id="theme" aria-label="Theme">◐</button></div><div class="row"><button id="exp" data-i="exp"></button><button id="imp" data-i="imp"></button><button id="priv" data-i="priv"></button></div><input id="impf" type="file" accept=".json" hidden>
<small data-i="foot" style="color:var(--mut)">Chats, memory and your key stay on this device only.</small></aside>
<div id="main"><div id="top"><button id="menu" aria-label="Menu">☰</button><span class="logo">✦</span><b>Nova AI</b></div>
<div id="msgs" aria-live="polite"><div class="w" id="log"></div></div>
<div class="w" id="docbar" hidden></div>
<div id="box"><button id="att" aria-label="Attach image, PDF or text file">📎</button><input id="file" type="file" accept=".txt,.md,.csv,.pdf,image/*" hidden>
<textarea id="in" rows="1" placeholder="Message Nova AI…"></textarea><button id="web" aria-label="Web search" hidden>🌐</button><button id="gen" aria-label="Generate image" hidden>🎨</button><button id="mic" aria-label="Voice input" hidden>🎤</button><button id="vm" aria-label="Voice conversation" hidden>🎧</button><button id="send">Send</button></div>
<p class="note">Nova AI can make mistakes. Check important information.</p></div>

<dialog id="dcfg"><b data-i="setT"></b>
<p style="font-size:14px;color:var(--mut);margin:6px 0" data-i="setP"></p>
<label data-i="prov"></label><select id="pre"><option value="https://openrouter.ai/api/v1">OpenRouter</option><option value="https://api.groq.com/openai/v1">Groq</option><option value="https://generativelanguage.googleapis.com/v1beta/openai">Google Gemini</option><option value="">Custom (OpenAI-compatible)</option></select>
<label data-i="base"></label><input id="base" autocomplete="off">
<label data-i="model"></label><input id="model" autocomplete="off" data-p="modelph">
<label data-i="key"></label><input id="key" type="password" autocomplete="off">
<div class="row" style="margin-top:12px"><button id="csave" data-i="save"></button><button id="cclose" data-i="close"></button></div>
<button id="share" style="width:100%;margin-top:10px" data-i="share"></button>
<small style="color:var(--mut)" data-i="shareW"></small></dialog>
<dialog id="dmem"><b data-i="memT"></b><textarea id="memt" rows="6" maxlength="1500" style="width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px"></textarea>
<div class="row" style="margin-top:8px"><button id="msave" data-i="save"></button><button id="mclose" data-i="close"></button></div></dialog>

<dialog id="dpriv"><b data-i="priv"></b><div id="privt" style="font-size:14px"></div><button id="pdel" style="margin-top:10px;width:100%">🗑 Delete all my data / सारा डेटा हटाएँ</button><button id="pclose" style="margin-top:10px;width:100%">OK</button></dialog>
<dialog id="dvo" style="text-align:center"><button id="orb" class="orb" aria-label="Tap to talk"></button><p id="vst" style="color:var(--mut)"></p><p id="vtx" style="max-height:30vh;overflow:auto"></p><button id="vend" style="width:100%">End voice chat</button></dialog>
<dialog id="dpv" style="width:min(96vw,760px)"><iframe id="pvf" sandbox="allow-scripts" title="Preview"></iframe><button id="pvx" style="width:100%;margin-top:8px">Close</button></dialog>
<script>
