name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["main", "nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: nova2-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile from pinned workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Apply non-breaking npm security fixes to lockfile
        run: npm audit fix --ignore-scripts
      - name: Format rebuild branch and commit changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/nova-2.0/rebuild'
        run: |
          npx prettier --write apps/web apps/api packages/shared config scripts/check-i18n.mjs scripts/check-secrets.mjs scripts/check-schemes.mjs scripts/run-evals.mjs scripts/run-real-provider-evals.mjs scripts/check-bundle-budget.mjs tests/nova2 vitest.config.ts playwright.config.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json apps/web apps/api packages/shared config scripts/check-i18n.mjs scripts/check-secrets.mjs scripts/check-schemes.mjs scripts/run-evals.mjs scripts/run-real-provider-evals.mjs scripts/check-bundle-budget.mjs tests/nova2 vitest.config.ts playwright.config.ts
            git commit -m "style: format NOVA 2.0 source"
            git push origin HEAD:nova-2.0/rebuild
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches -d '{"ref":"nova-2.0/rebuild"}'
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run evals
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:bundle
      - run: npm run lighthouse
  database:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start isolated local Supabase stack
        run: cd supabase-v2 && supabase start
      - name: Apply and verify local synthetic schema
        run: |
          cd supabase-v2 && supabase db reset
          cd supabase-v2 && supabase migration list
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-schema.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Verify durable mock wallet integration
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          MOCK_FEATURES_ENABLED: "true"
      - name: Rehearse synthetic schema backup and restore
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --schema=nova2_staging --format=custom --no-owner --file=/tmp/nova2-staging.dump
          pg_restore --list /tmp/nova2-staging.dump >/tmp/nova2-staging.contents
          PGPASSWORD=postgres createdb -h 127.0.0.1 -p 54332 -U postgres nova2_restore_check
          RESTORE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54332/nova2_restore_check
          pg_restore --no-owner --dbname="$RESTORE_DATABASE_URL" /tmp/nova2-staging.dump
          TABLES=$(psql "$RESTORE_DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema = 'nova2_staging'")
          test "$TABLES" -ge 5
          echo "SYNTHETIC BACKUP/RESTORE PASS: $TABLES tables restored"
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Stop local Supabase stack
        if: always()
        run: cd supabase-v2 && supabase stop
