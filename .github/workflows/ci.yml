name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: nova2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Generate initial migration using Supabase CLI v3 (local only)
        shell: bash
        run: |
          mkdir -p supabase/migrations
          if ! compgen -G "supabase/migrations/*_nova2_initial.sql" > /dev/null; then
            supabase migration new nova2_initial < supabase/schema.sql
          fi
      - name: Persist generated migration on rebuild branch
        run: |
          if ! git diff --quiet -- supabase/migrations; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/migrations
            git commit -m "db: scaffold initial migration using Supabase CLI"
            git push
          fi
      - name: Generate lockfile from pinned workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Persist generated lockfile on rebuild branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update generated lockfile"
            git push
          fi
      - run: npm ci
      - name: Format the new workspace consistently
        run: npx prettier --write apps/web apps/api packages/shared config scripts/check-i18n.mjs scripts/check-secrets.mjs scripts/check-schemes.mjs scripts/run-evals.mjs
      - name: Persist formatting pass
        run: |
          if ! git diff --quiet -- apps packages config scripts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps packages config scripts
            git commit -m "chore: format NOVA 2.0 workspace"
            git push
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run evals
      - run: npm run audit
      - run: npm run build
  database:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply and verify local synthetic schema
        run: |
          supabase db reset
          supabase migration list
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
