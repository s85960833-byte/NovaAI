name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["main", "nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova2-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Capture exact Prettier output for audit guard
        run: |
          npx prettier --write scripts/check-dependency-audit.mjs
          printf 'PRETTIER_FILE_BEGIN:scripts/check-dependency-audit.mjs\n'
          base64 -w0 scripts/check-dependency-audit.mjs
          printf '\nPRETTIER_FILE_END:scripts/check-dependency-audit.mjs\n'
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run evals
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser evidence even when E2E fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-playwright-evidence
          path: |
            test-results/
            playwright-report/
            artifacts/frame-time-metrics.json
          if-no-files-found: ignore
      - run: npm run check:bundle
      - run: npm run lighthouse
      - name: Upload Lighthouse reports and build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-lighthouse-evidence
          path: |
            .lighthouseci/
            artifacts/
          if-no-files-found: ignore
  database:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package for database integration tests
        run: npm run build --workspace @nova/shared
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start isolated local Supabase stack
        run: cd supabase-v2 && supabase start
      - name: Apply migrations from scratch and verify isolated schema/RLS
        run: |
          set -euo pipefail
          cd supabase-v2
          supabase db reset
          supabase migration list
          cd ..
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase-v2/scripts/check-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase-v2/scripts/check-account-lifecycle.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Verify durable mock wallet integration
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          MOCK_FEATURES_ENABLED: "true"
      - name: Rehearse synthetic schema backup and restore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nova2-backup"
          RESTORE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54332/nova2_restore_check
          docker run --rm --network host             -e DATABASE_URL="$DATABASE_URL"             -e RESTORE_DATABASE_URL="$RESTORE_DATABASE_URL"             -v "$RUNNER_TEMP/nova2-backup:/backup"             postgres:17-alpine sh -ec '
              pg_dump "$DATABASE_URL" --schema=nova2_staging --format=custom --no-owner --file=/backup/nova2-staging.dump
              pg_restore --list /backup/nova2-staging.dump >/backup/nova2-staging.contents
              PGPASSWORD=postgres createdb -h 127.0.0.1 -p 54332 -U postgres nova2_restore_check
              pg_restore --no-owner --single-transaction --dbname="$RESTORE_DATABASE_URL" /backup/nova2-staging.dump
              ORIGINAL=$(psql "$DATABASE_URL" -Atc "select concat_ws(chr(58),(select count(*) from nova2_staging.wallet_accounts),(select count(*) from nova2_staging.wallet_orders),(select count(*) from nova2_staging.wallet_ledger),(select count(*) from nova2_staging.wallet_events),(select count(*) from nova2_staging.ai_spend_events))")
              RESTORED=$(psql "$RESTORE_DATABASE_URL" -Atc "select concat_ws(chr(58),(select count(*) from nova2_staging.wallet_accounts),(select count(*) from nova2_staging.wallet_orders),(select count(*) from nova2_staging.wallet_ledger),(select count(*) from nova2_staging.wallet_events),(select count(*) from nova2_staging.ai_spend_events))")
              test "$ORIGINAL" = "$RESTORED"
              TABLES=$(psql "$RESTORE_DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema = chr(110)||chr(111)||chr(118)||chr(97)||chr(50)||chr(95)||chr(115)||chr(116)||chr(97)||chr(103)||chr(105)||chr(110)||chr(103)")
              test "$TABLES" -ge 5
              echo "SYNTHETIC BACKUP/RESTORE PASS: $TABLES tables; row counts $RESTORED"
            '
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Upload isolated database evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-database-evidence
          path: ${{ runner.temp }}/nova2-backup/
          if-no-files-found: ignore
      - name: Stop local Supabase stack
        if: always()
        run: cd supabase-v2 && supabase stop


  staging-smoke:
    needs: [checks, database]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run small read-only load test against Free staging
        run: npm run test:staging:load
        env:
          STAGING_URL: https://nova-2-staging.onrender.com
      - name: Upload staging load evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-staging-load-evidence
          path: artifacts/staging-load.json
          if-no-files-found: ignore
