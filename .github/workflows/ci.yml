name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: nova2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile from pinned workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: npm ci
      - name: Format workspace
        run: npx prettier --write apps/web apps/api packages/shared config scripts/check-i18n.mjs scripts/check-secrets.mjs scripts/check-schemes.mjs scripts/run-evals.mjs scripts/check-bundle-budget.mjs vitest.config.ts playwright.config.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run evals
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:bundle
      - run: npm run lighthouse
  database:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start isolated local Supabase stack
        run: cd supabase-v2 && supabase start
      - name: Apply and verify local synthetic schema
        run: |
          cd supabase-v2 && supabase db reset
          cd supabase-v2 && supabase migration list
      - name: Verify durable mock wallet integration
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          MOCK_FEATURES_ENABLED: "true"
      - name: Stop local Supabase stack
        if: always()
        run: cd supabase-v2 && supabase stop
