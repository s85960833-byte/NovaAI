name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["main", "nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova2-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run evals
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser evidence even when E2E fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-playwright-evidence
          path: |
            test-results/
            playwright-report/
            artifacts/frame-time-metrics.json
          if-no-files-found: ignore
      - run: npm run check:bundle
      - run: npm run lighthouse
      - name: Upload Lighthouse reports and build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nova2-lighthouse-evidence
          path: |
            .lighthouseci/
            artifacts/
          if-no-files-found: ignore
  database:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package for database integration tests
        run: npm run build --workspace @nova/shared
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start isolated local Supabase stack
        run: cd supabase-v2 && supabase start
      - name: Apply and verify local synthetic schema
        run: |
          cd supabase-v2 && supabase db reset
          cd supabase-v2 && supabase migration list
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-schema.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Verify durable mock wallet integration
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          MOCK_FEATURES_ENABLED: "true"
      - name: Rehearse synthetic schema backup and restore
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --schema=nova2_staging --format=custom --no-owner --file=/tmp/nova2-staging.dump
          pg_restore --list /tmp/nova2-staging.dump >/tmp/nova2-staging.contents
          PGPASSWORD=postgres createdb -h 127.0.0.1 -p 54332 -U postgres nova2_restore_check
          RESTORE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54332/nova2_restore_check
          pg_restore --no-owner --dbname="$RESTORE_DATABASE_URL" /tmp/nova2-staging.dump
          TABLES=$(psql "$RESTORE_DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema = 'nova2_staging'")
          test "$TABLES" -ge 5
          echo "SYNTHETIC BACKUP/RESTORE PASS: $TABLES tables restored"
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
      - name: Stop local Supabase stack
        if: always()
        run: cd supabase-v2 && supabase stop
