name: NOVA 2.0 CI
on:
  pull_request:
    branches: ["nova-2.0/rebuild"]
  push:
    branches: ["nova-2.0/rebuild"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: nova2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: "!contains(github.event.head_commit.message, 'chore: update generated lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile from pinned workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit generated lockfile to rebuild branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update generated lockfile"
            git push
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:schemes
      - run: npm run check:secrets
      - run: npm run audit
      - run: npm run build
