name: NovaAI verification
on:
  push:
    branches: [main, feature-upgrade, feature-english, feature-image-fallback-stability, ui-s-tier, feature-s-tier-studio, feature-ai-council-evidence, feature-council-citation-audit, restore-full-nova-workspaces-20261101, feature-indian-future-ui, feature-nova-next-ui-20261101]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend and frontend syntax
        run: node scripts/check.mjs
      - name: Check isolated mode registry
        run: node scripts/modes-check.mjs
      - name: Validate 60-case AI evaluation fixture
        run: node scripts/validate-ai-evaluation.mjs
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Start local server with test-only credentials
        run: |
          LLM_KEY=test LLM_MODEL=test-model PORT=8787 node nova-server.txt > /tmp/novaai-test.log 2>&1 &
          echo $! > /tmp/novaai-test.pid
      - name: Exercise local routes and PWA assets
        run: node scripts/runtime-smoke.mjs
      - name: Install Devanagari fonts for visual regression screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-match 'Noto Sans Devanagari' | grep -q 'Noto Sans Devanagari'
      - name: Install Chromium for workspace browser tests
        run: npx playwright install chromium
      - name: Verify responsive workspace interactions in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Run five-viewport mobile and drawer regression tests
        run: npm run test:mobile-layout
      - name: Upload integrated browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-integrated-browser-verification
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Wait for the merged bilingual revision to become live on Render
        if: github.ref == 'refs/heads/main'
        env:
          NOVAAI_URL: https://novaai-4auo.onrender.com
        run: node scripts/wait-live.mjs
      - name: Smoke-test live website and providers
        if: github.ref == 'refs/heads/main'
        env:
          NOVAAI_URL: https://novaai-4auo.onrender.com
        run: node scripts/smoke.mjs
      - name: Smoke-test live free image generation without paid AI credits
        if: github.ref == 'refs/heads/main'
        env:
          NOVAAI_URL: https://novaai-4auo.onrender.com
        run: node scripts/smoke-free-image.mjs
