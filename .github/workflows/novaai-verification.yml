name: NovaAI verification
on:
  push:
    branches: [main, feature/nova-business-intelligence, feature-upgrade, feature-english, feature-image-fallback-stability, ui-s-tier, feature-s-tier-studio, feature-ai-council-evidence, feature-council-citation-audit, restore-full-nova-workspaces-20261101, feature-indian-future-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_bi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_bi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend and frontend syntax
        run: node scripts/check.mjs
      - name: Check isolated mode registry
        run: node scripts/modes-check.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply NOVA BI migrations and verify tenant RLS in PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: nova_bi_test
        run: bash scripts/test-supabase-migrations.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install authenticated NOVA BI Edge Function dependencies
        run: deno install --config supabase/functions/nova-bi-api/deno.json
      - name: Type-check authenticated NOVA BI Edge Function
        run: deno check --config supabase/functions/nova-bi-api/deno.json --no-lock supabase/functions/nova-bi-api/index.ts
      - name: Smoke-test deployed NOVA BI Edge Function auth and CORS
        run: node scripts/supabase-edge-smoke.mjs
      - name: Test NOVA Business Intelligence calculations and CSV validation
        run: node --test scripts/business-intelligence.test.cjs
      - name: Start local server with test-only credentials
        run: |
          LLM_KEY=test LLM_MODEL=test-model PORT=8787 node nova-server.txt > /tmp/novaai-test.log 2>&1 &
          echo $! > /tmp/novaai-test.pid
      - name: Exercise local routes and PWA assets
        run: node scripts/runtime-smoke.mjs
      - name: Wait for the merged bilingual revision to become live on Render
        if: github.ref == 'refs/heads/main'
        env:
          NOVAAI_URL: https://novaai-4auo.onrender.com
        run: node scripts/wait-live.mjs
      - name: Smoke-test live website and providers
        if: github.ref == 'refs/heads/main'
        env:
          NOVAAI_URL: https://novaai-4auo.onrender.com
        run: node scripts/smoke.mjs
